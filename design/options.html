<!doctype html>
<meta charset="utf-8">
<title>Background + Intro — 5 options</title>
<style>
  :root{
    --bg:#08090c; --bg-2:#0d0f14; --panel:#14161c; --panel-2:#1a1d25;
    --line:#23262f; --ink:#eceef2; --dim:#868c99;
    --accent:#22d3ee; --accent-rgb:34,211,238; --gold:#e8b45c; --ok:#3fb950;
    color-scheme:dark;
  }
  *{box-sizing:border-box}
  body{margin:0;height:100vh;overflow:hidden;background:var(--bg);color:var(--ink);
       font:14px/1.55 "Segoe UI",system-ui,sans-serif}

  /* ---------- shared shells ---------- */
  #bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
  #bg i{position:absolute;display:block}
  #intro{position:fixed;inset:0;z-index:50;display:grid;place-content:center;justify-items:center;
         background:radial-gradient(90% 70% at 50% 45%,var(--bg-2),var(--bg) 72%);
         transition:opacity .7s cubic-bezier(.4,0,.2,1),transform .7s cubic-bezier(.4,0,.2,1),filter .7s}
  #intro.gone{opacity:0;transform:scale(1.06);filter:blur(6px);pointer-events:none}
  #intro.off{display:none}

  /* the mock app underneath, so each background can be judged behind real UI */
  #stage{position:relative;z-index:1;height:100vh;display:grid;place-content:center;padding:0 24px}
  .wrap{width:min(760px,92vw)}
  .hero h1{margin:0 0 4px;font-size:26px;letter-spacing:-.02em}
  .hero p{margin:0 0 20px;color:var(--dim);font-size:13px}
  .chips{display:flex;gap:8px;margin-bottom:14px;flex-wrap:wrap}
  .chips button{padding:7px 13px;border-radius:999px;border:1px solid var(--line);
                background:rgba(255,255,255,.03);color:var(--dim);font:inherit;font-size:12.5px;cursor:pointer}
  .chips button.on{border-color:rgba(var(--accent-rgb),.5);color:var(--ink);
                   background:rgba(var(--accent-rgb),.12)}
  .card{border:1px solid var(--line);border-radius:14px;padding:18px 20px;
        background:linear-gradient(180deg,rgba(20,22,28,.82),rgba(13,15,20,.82));
        backdrop-filter:blur(9px);box-shadow:0 18px 44px rgba(0,0,0,.45)}
  .card h3{margin:0 0 12px;font-size:13px;font-weight:600;color:var(--dim);
           text-transform:uppercase;letter-spacing:.08em}
  .row{display:flex;justify-content:space-between;align-items:center;
       padding:10px 0;border-top:1px solid rgba(255,255,255,.05)}
  .row:first-of-type{border-top:0}
  .row b{font-weight:600;font-size:13.5px}
  .row .ctc{color:var(--gold);font-weight:700;font-variant-numeric:tabular-nums}
  .join{margin-top:16px;width:100%;padding:12px;border-radius:11px;border:0;cursor:pointer;
        background:linear-gradient(135deg,var(--accent),#0ea5e9);color:#04121a;font:inherit;font-weight:700}

  /* ---------- chooser bar ---------- */
  #bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:80;
       display:flex;gap:6px;padding:7px;border-radius:14px;border:1px solid var(--line);
       background:rgba(12,14,19,.92);backdrop-filter:blur(12px);box-shadow:0 14px 40px rgba(0,0,0,.6)}
  #bar button{padding:8px 12px;border-radius:9px;border:1px solid transparent;cursor:pointer;
              background:transparent;color:var(--dim);font:inherit;font-size:12.5px;white-space:nowrap}
  #bar button:hover{color:var(--ink);background:rgba(255,255,255,.05)}
  #bar button.on{color:var(--ink);border-color:rgba(var(--accent-rgb),.45);
                 background:rgba(var(--accent-rgb),.14)}
  #bar .sep{width:1px;background:var(--line);margin:4px 3px}
  #bar .replay{color:var(--accent)}
  #tag{position:fixed;left:0;right:0;bottom:74px;z-index:80;text-align:center;
       color:var(--dim);font-size:12px;letter-spacing:.03em;padding:0 20px}

  /* =====================================================================
     1 — BOARDROOM.  Ek asli conference room: perspective floor peeche
     jaata hua, baayein se blinds ki roshni, table ka reflection.
     ===================================================================== */
  .b1 .warm{inset:0;background:
      radial-gradient(120% 80% at 18% 8%,rgba(232,180,92,.16),transparent 58%),
      radial-gradient(100% 90% at 82% 100%,rgba(34,211,238,.07),transparent 62%)}
  .b1 .floor{left:-60%;right:-60%;bottom:-14%;height:66%;
      background-image:
        repeating-linear-gradient(90deg,rgba(255,255,255,.075) 0 1px,transparent 1px 90px),
        repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 1px,transparent 1px 68px);
      transform:perspective(430px) rotateX(73deg);transform-origin:50% 100%;
      mask-image:linear-gradient(to top,#000 4%,transparent 72%)}
  .b1 .blinds{left:0;top:0;width:56%;height:100%;
      background:repeating-linear-gradient(177deg,rgba(232,180,92,.10) 0 11px,transparent 11px 40px);
      mask-image:radial-gradient(78% 95% at -4% 26%,#000,transparent 72%);
      animation:blindDrift 26s ease-in-out infinite alternate}
  .b1 .table{left:50%;bottom:0;width:150%;height:34%;transform:translateX(-50%);
      background:linear-gradient(to top,rgba(232,180,92,.10),transparent 70%);
      mask-image:radial-gradient(60% 100% at 50% 100%,#000,transparent 78%)}
  @keyframes blindDrift{to{opacity:.55;transform:translateX(14px)}}

  .in1{background:#05060a}
  .in1 .bars{position:absolute;inset:0;overflow:hidden}
  .in1 .bars i{position:absolute;left:-10%;width:120%;height:2px;
      background:linear-gradient(90deg,transparent,rgba(232,180,92,.85),transparent);
      opacity:0;transform:scaleX(.2);
      animation:lightOn .9s cubic-bezier(.2,.8,.3,1) forwards}
  .in1 .bars i:nth-child(1){top:26%;animation-delay:.15s}
  .in1 .bars i:nth-child(2){top:50%;animation-delay:.35s}
  .in1 .bars i:nth-child(3){top:74%;animation-delay:.55s}
  @keyframes lightOn{40%{opacity:1;transform:scaleX(1)}to{opacity:.14;transform:scaleX(1)}}
  .in1 .room{position:absolute;inset:0;opacity:0;
      background:
        repeating-linear-gradient(177deg,rgba(232,180,92,.11) 0 11px,transparent 11px 40px),
        radial-gradient(120% 80% at 18% 8%,rgba(232,180,92,.13),transparent 60%);
      mask-image:radial-gradient(85% 100% at -2% 24%,#000 18%,transparent 76%);
      animation:fadeIn 1.1s ease .8s forwards}
  .in1 h1{position:relative;margin:0;font-size:34px;font-weight:700;letter-spacing:-.02em;
      opacity:0;transform:translateY(10px);animation:riseIn .8s cubic-bezier(.2,.8,.3,1) 1.15s forwards}
  .in1 .sub{color:var(--dim);font-size:13px;margin-top:16px;letter-spacing:.05em;opacity:0;
      animation:fadeIn .8s ease 1.7s forwards}

  /* =====================================================================
     2 — DECODE.  Peeche dheere girte hue CS topic ke column; intro me
     naam random characters se decode hoke banta hai.
     ===================================================================== */
  #bg.b2 .cols{inset:0;display:flex;justify-content:space-between;padding:0 2%;
      mask-image:radial-gradient(120% 100% at 50% 45%,transparent 22%,#000 62%,transparent 96%);
      opacity:.34}
  .b2 .cols span{display:block;font:11px/2.1 Consolas,ui-monospace,monospace;color:rgba(255,255,255,.16);
      white-space:pre;animation:fall linear infinite}
  .b2 .cols span em{font-style:normal;color:rgba(var(--accent-rgb),.55)}
  @keyframes fall{from{transform:translateY(-50%)}to{transform:translateY(0)}}
  .b2 .vig{inset:0;background:
      radial-gradient(46% 42% at 50% 46%,var(--bg) 42%,transparent 78%),
      radial-gradient(95% 78% at 50% 45%,transparent 44%,var(--bg) 92%)}
  .b2 .scan{left:0;right:0;height:180px;
      background:linear-gradient(to bottom,transparent,rgba(var(--accent-rgb),.05),transparent);
      animation:scan 9s linear infinite}
  @keyframes scan{from{top:-180px}to{top:100%}}

  .in2{background:#06070b}
  .in2 .term{font:14px/1.9 Consolas,ui-monospace,monospace;color:var(--dim);text-align:left;
      min-width:340px;margin-bottom:26px}
  .in2 .term p{margin:0;opacity:0;animation:fadeIn .01s linear forwards}
  .in2 .term p:nth-child(1){animation-delay:.15s}
  .in2 .term p:nth-child(2){animation-delay:.65s}
  .in2 .term p:nth-child(3){animation-delay:1.05s}
  .in2 .term b{color:var(--accent);font-weight:400}
  .in2 .term .ok{color:var(--ok)}
  .in2 .cursor{display:inline-block;width:8px;height:15px;vertical-align:-2px;
      background:var(--accent);animation:blink .9s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .in2 h1{margin:0;font:700 32px/1.1 Consolas,ui-monospace,monospace;letter-spacing:.02em;
      opacity:0;animation:fadeIn .3s ease 1.25s forwards}
  .in2 .sub{color:var(--dim);font-size:12.5px;margin-top:16px;letter-spacing:.1em;
      text-transform:uppercase;opacity:0;animation:fadeIn .7s ease 2.35s forwards}

  /* =====================================================================
     3 — JOIN CALL.  App ka apna kaam hi intro hai: chaar tiles connect
     hote hain, phir sikud ke naam ban jaate hain.
     ===================================================================== */
  .b3 .bok{border-radius:50%;filter:blur(46px);opacity:.5}
  .b3 .k1{width:340px;height:340px;left:6%;top:8%;background:rgba(34,211,238,.16);
      animation:float 30s ease-in-out infinite alternate}
  .b3 .k2{width:280px;height:280px;right:10%;top:22%;background:rgba(14,165,233,.14);
      animation:float 38s ease-in-out infinite alternate-reverse}
  .b3 .k3{width:420px;height:420px;left:32%;bottom:-14%;background:rgba(232,180,92,.07);
      animation:float 44s ease-in-out infinite alternate}
  @keyframes float{to{transform:translate(46px,-38px) scale(1.12)}}
  .b3 .mesh{inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),
      linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:56px 56px;
      mask-image:radial-gradient(120% 100% at 50% 35%,#000 40%,transparent 88%)}
  .b3 .vig{inset:0;background:radial-gradient(100% 80% at 50% 40%,transparent 34%,rgba(4,5,8,.86) 92%)}

  .in3{background:radial-gradient(90% 70% at 50% 42%,#0d0f14,#06070a 74%)}
  .in3 .tiles{display:grid;grid-template-columns:repeat(2,132px);gap:12px;margin-bottom:30px;
      animation:tilesOut .8s cubic-bezier(.5,0,.2,1) 1.85s forwards}
  @keyframes tilesOut{to{transform:scale(.42) translateY(38px);opacity:0;filter:blur(4px)}}
  .in3 .tile{height:92px;border-radius:12px;border:1px solid var(--line);position:relative;
      background:linear-gradient(180deg,#191c24,#111319);overflow:hidden;
      opacity:0;transform:scale(.9);
      animation:tileIn .55s cubic-bezier(.2,.9,.3,1) forwards}
  .in3 .tile:nth-child(1){animation-delay:.15s}
  .in3 .tile:nth-child(2){animation-delay:.35s}
  .in3 .tile:nth-child(3){animation-delay:.55s}
  .in3 .tile:nth-child(4){animation-delay:.75s}
  @keyframes tileIn{to{opacity:1;transform:none}}
  .in3 .tile::before{content:"";position:absolute;left:50%;top:38%;width:30px;height:30px;
      margin:-15px 0 0 -15px;border-radius:50%;background:rgba(255,255,255,.10)}
  .in3 .tile::after{content:"";position:absolute;left:50%;top:38%;width:30px;height:30px;
      margin:-15px 0 0 -15px;border-radius:50%;border:2px solid rgba(var(--accent-rgb),.7);
      animation:ping 1.4s ease-out infinite}
  .in3 .tile:nth-child(2)::after{animation-delay:.3s}
  .in3 .tile:nth-child(3)::after{animation-delay:.6s}
  .in3 .tile:nth-child(4)::after{animation-delay:.9s}
  @keyframes ping{to{transform:scale(2.4);opacity:0}}
  .in3 .tile i{position:absolute;left:8px;bottom:7px;font-style:normal;font-size:10.5px;color:var(--dim)}
  .in3 .mid{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center}
  .in3 h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em;opacity:0;
      transform:scale(.94);animation:popIn .8s cubic-bezier(.2,1,.3,1) 2.3s forwards}
  .in3 .sub{color:var(--dim);font-size:13px;margin-top:9px;opacity:0;
      animation:fadeIn .7s ease 2.7s forwards}
  @keyframes popIn{to{opacity:1;transform:none}}
  .in3 .status{position:absolute;left:0;right:0;bottom:30%;text-align:center;color:var(--dim);
      font-size:12px;letter-spacing:.09em;text-transform:uppercase;
      animation:fadeOut .4s ease 1.9s forwards}
  @keyframes fadeOut{to{opacity:0}}

  /* =====================================================================
     4 — BLUEPRINT.  Engineering drawing jaisa: fine graticule, corner
     ticks, gold ink. Intro me stroke khud khinchta hai aur seal padti hai.
     ===================================================================== */
  .b4 .grid{inset:0;background-image:
      linear-gradient(rgba(232,180,92,.055) 1px,transparent 1px),
      linear-gradient(90deg,rgba(232,180,92,.055) 1px,transparent 1px),
      linear-gradient(rgba(232,180,92,.10) 1px,transparent 1px),
      linear-gradient(90deg,rgba(232,180,92,.10) 1px,transparent 1px);
      background-size:22px 22px,22px 22px,110px 110px,110px 110px;
      mask-image:radial-gradient(130% 110% at 50% 40%,#000 40%,transparent 90%)}
  .b4 .paper{inset:0;background:
      radial-gradient(90% 70% at 50% 12%,rgba(232,180,92,.09),transparent 60%),
      radial-gradient(80% 60% at 50% 100%,rgba(232,180,92,.05),transparent 62%)}
  .b4 .tick{width:26px;height:26px;border:1px solid rgba(232,180,92,.30)}
  .b4 .t1{left:26px;top:26px;border-right:0;border-bottom:0}
  .b4 .t2{right:26px;top:26px;border-left:0;border-bottom:0}
  .b4 .t3{left:26px;bottom:26px;border-right:0;border-top:0}
  .b4 .t4{right:26px;bottom:26px;border-left:0;border-top:0}
  .b4 .vig{inset:0;background:radial-gradient(100% 80% at 50% 45%,transparent 40%,rgba(6,6,9,.7) 95%)}

  .in4{background:radial-gradient(90% 70% at 50% 40%,#0f0e0b,#07070a 76%)}
  .in4 svg{overflow:visible;margin-bottom:6px}
  .in4 svg path{fill:none;stroke:var(--gold);stroke-width:2;stroke-linecap:round;
      stroke-dasharray:520;stroke-dashoffset:520;
      animation:draw 1.5s cubic-bezier(.5,0,.2,1) .2s forwards}
  @keyframes draw{to{stroke-dashoffset:0}}
  .in4 h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.015em;
      clip-path:inset(0 100% 0 0);animation:wipe 1.1s cubic-bezier(.4,0,.2,1) .55s forwards}
  @keyframes wipe{to{clip-path:inset(0 0 0 0)}}
  .in4 .sub{color:var(--dim);font-size:12.5px;margin-top:12px;letter-spacing:.06em;opacity:0;
      animation:fadeIn .7s ease 1.5s forwards}
  .in4 .stamp{margin-top:26px;padding:8px 20px;border:2px solid rgba(232,180,92,.75);
      border-radius:6px;color:var(--gold);font-weight:800;font-size:13px;letter-spacing:.22em;
      opacity:0;transform:rotate(-9deg) scale(2.1);
      animation:stamp .5s cubic-bezier(.3,1.5,.5,1) 1.95s forwards}
  @keyframes stamp{to{opacity:.92;transform:rotate(-9deg) scale(1)}}

  /* =====================================================================
     5 — DEPTH FIELD.  Canvas particles jo cursor ke saath parallax karte
     hain; intro me particles udd ke ek ring me jam jaate hain.
     ===================================================================== */
  .b5 canvas{position:absolute;inset:0;width:100%;height:100%}
  .b5 .aur{inset:-30%;filter:blur(80px);opacity:.55;
      background:
        radial-gradient(38% 42% at 28% 32%,rgba(34,211,238,.30),transparent 62%),
        radial-gradient(34% 38% at 74% 62%,rgba(14,165,233,.24),transparent 64%),
        radial-gradient(30% 34% at 52% 88%,rgba(232,180,92,.13),transparent 66%);
      animation:aurora 34s ease-in-out infinite alternate}
  @keyframes aurora{to{transform:translate(-5%,4%) rotate(9deg) scale(1.16)}}
  .b5 .vig{inset:0;background:radial-gradient(95% 75% at 50% 42%,transparent 32%,rgba(4,5,8,.9) 94%)}

  .in5{background:radial-gradient(80% 60% at 50% 45%,#0a0d14,#05060a 78%)}
  .in5 .field{position:absolute;inset:0;overflow:hidden}
  .in5 .field b{position:absolute;left:50%;top:50%;width:3px;height:3px;border-radius:50%;
      background:rgba(var(--accent-rgb),.85);
      transform:translate(var(--x),var(--y)) scale(var(--s));opacity:0;
      animation:converge 1.5s cubic-bezier(.3,0,.15,1) forwards;
      animation-delay:calc(var(--d) * 1ms)}
  @keyframes converge{
    20%{opacity:1}
    to{transform:translate(var(--tx),var(--ty)) scale(.8);opacity:.9}}
  .in5 .ring{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;
      border-radius:50%;border:1px solid rgba(var(--accent-rgb),.45);opacity:0;transform:scale(.4);
      animation:ringIn .8s cubic-bezier(.2,1.3,.4,1) 1.35s forwards}
  @keyframes ringIn{to{opacity:1;transform:scale(1)}}
  .in5 .core{position:absolute;left:50%;top:50%;width:12px;height:12px;margin:-6px 0 0 -6px;
      border-radius:50%;background:var(--accent);box-shadow:0 0 30px 8px rgba(var(--accent-rgb),.5);
      opacity:0;animation:fadeIn .6s ease 1.5s forwards}
  .in5 .txt{position:absolute;left:0;right:0;top:calc(50% + 82px);text-align:center}
  .in5 h1{margin:0;font-size:30px;font-weight:700;letter-spacing:-.02em;opacity:0;
      transform:translateY(14px);animation:riseIn .8s cubic-bezier(.2,.8,.3,1) 1.75s forwards}
  .in5 .sub{color:var(--dim);font-size:12.5px;margin-top:10px;opacity:0;
      animation:fadeIn .7s ease 2.15s forwards}

  @keyframes fadeIn{to{opacity:1}}
  @keyframes riseIn{to{opacity:1;transform:none}}
</style>

<div id="bg" aria-hidden="true"></div>

<div id="stage">
  <div class="wrap">
    <div class="hero">
      <h1>Intervya</h1>
      <p>Ye asli UI ka mock hai &mdash; taaki background ke peeche form kaisa lagta hai wo dikh jaye.</p>
    </div>
    <div class="chips">
      <button class="on">Service-based</button><button>Product</button>
      <button>Startups</button><button>GCC / Consulting</button>
    </div>
    <div class="card">
      <h3>TCS &mdash; role track</h3>
      <div class="row"><b>Ninja</b><span class="ctc">&#8377;3.36 LPA</span></div>
      <div class="row"><b>Digital</b><span class="ctc">&#8377;7&ndash;7.5 LPA</span></div>
      <div class="row"><b>Prime</b><span class="ctc">&#8377;9&ndash;11.5 LPA</span></div>
      <button class="join">Join interview</button>
    </div>
  </div>
</div>

<div id="intro" class="off"></div>
<div id="tag"></div>

<div id="bar">
  <button data-n="1">1 &middot; Boardroom</button>
  <button data-n="2">2 &middot; Decode</button>
  <button data-n="3">3 &middot; Join call</button>
  <button data-n="4">4 &middot; Blueprint</button>
  <button data-n="5">5 &middot; Depth field</button>
  <i class="sep"></i>
  <button class="replay" id="replay">&#9654; Intro dobara</button>
</div>

<script>
const WORDS = ["dbms", "normalization", "3NF", "binary search", "O(n log n)", "deadlock", "paging",
  "TCS", "Infosys", "Amazon", "SDE-1", "hashmap", "recursion", "OSI", "TCP", "index", "ACID", "REST",
  "pointer", "segment tree", "dijkstra", "mutex", "cache", "B-tree", "DFS", "join", "trigger", "heap"];
const rnd = (a) => a[Math.floor(Math.random() * a.length)];

const BG = {
  1: () => '<i class="warm"></i><i class="blinds"></i><i class="floor"></i><i class="table"></i>',
  2: () => {
    let cols = "";
    for (let c = 0; c < 14; c++) {
      let txt = "";
      for (let r = 0; r < 44; r++) {
        const w = rnd(WORDS);
        txt += (Math.random() < 0.12 ? "<em>" + w + "</em>" : w) + "\n";
      }
      cols += '<span style="animation-duration:' + (26 + Math.random() * 34).toFixed(1) +
              "s;animation-delay:-" + (Math.random() * 30).toFixed(1) + 's">' + txt + "</span>";
    }
    return '<i class="cols">' + cols + '</i><i class="scan"></i><i class="vig"></i>';
  },
  3: () => '<i class="mesh"></i><i class="bok k1"></i><i class="bok k2"></i><i class="bok k3"></i><i class="vig"></i>',
  4: () => '<i class="paper"></i><i class="grid"></i><i class="tick t1"></i><i class="tick t2"></i>' +
           '<i class="tick t3"></i><i class="tick t4"></i><i class="vig"></i>',
  5: () => '<i class="aur"></i><canvas id="stars"></canvas><i class="vig"></i>',
};

const NAME = "INTERVYA";
const SUB = "panel interview practice &mdash; aapke laptop pe";

const INTRO = {
  1: () => '<div class="bars"><i></i><i></i><i></i></div><div class="room"></div>' +
           "<h1>" + NAME + '</h1><div class="sub">' + SUB + "</div>",
  2: () => '<div class="term">' +
           "<p><b>&gt;</b> panel.connect()</p>" +
           '<p>&nbsp;&nbsp;loading 4 interviewers<span class="cursor"></span></p>' +
           '<p>&nbsp;&nbsp;<span class="ok">ready</span></p></div>' +
           '<h1 id="scramble">&nbsp;</h1><div class="sub">no sugar-coating</div>',
  3: () => '<div class="status">connecting&hellip;</div>' +
           '<div class="tiles">' +
           '<div class="tile"><i>Ravi &middot; SDE-2</i></div><div class="tile"><i>Neha &middot; HR</i></div>' +
           '<div class="tile"><i>Arjun &middot; Manager</i></div><div class="tile"><i>You</i></div></div>' +
           '<div class="mid"><h1>' + NAME + '</h1><div class="sub">' + SUB + "</div></div>",
  4: () => '<svg width="300" height="34"><path d="M6 26 C 70 6, 150 34, 294 14"/></svg>' +
           "<h1>" + NAME + '</h1><div class="sub">' + SUB + "</div>" +
           '<div class="stamp">MOCK ROUND</div>',
  5: () => {
    let f = "";
    for (let i = 0; i < 64; i++) {
      const a = (i / 64) * Math.PI * 2;
      const dist = 260 + Math.random() * 460;
      // Start far out along a ray, settle onto a 46px ring at the same angle.
      f += '<b style="--x:' + (Math.cos(a) * dist).toFixed(0) +
           "px;--y:" + (Math.sin(a) * dist).toFixed(0) +
           "px;--tx:" + (Math.cos(a) * 46).toFixed(1) +
           "px;--ty:" + (Math.sin(a) * 46).toFixed(1) +
           "px;--s:" + (0.6 + Math.random() * 1.5).toFixed(2) +
           ";--d:" + (Math.random() * 380).toFixed(0) + '"></b>';
    }
    return '<div class="field">' + f + '</div><div class="ring"></div><div class="core"></div>' +
           '<div class="txt"><h1>' + NAME + '</h1><div class="sub">' + SUB + "</div></div>";
  },
};

const TAGS = {
  1: "Boardroom — perspective floor, blinds ki roshni, table ka reflection. Intro: kamre ki batti jalti hai, phir naam.",
  2: "Decode — peeche girte hue CS topics. Intro: terminal type hota hai, phir naam random characters se decode hota hai.",
  3: "Join call — app ka apna kaam hi intro hai: 4 tiles connect hote hain, phir sikud ke naam ban jaate hain.",
  4: "Blueprint — engineering drawing, gold ink, corner ticks. Intro: stroke khud khinchta hai, phir seal padti hai.",
  5: "Depth field — cursor ke saath parallax starfield. Intro: particles udd ke ek ring me jam jaate hain.",
};

const bg = document.getElementById("bg");
const intro = document.getElementById("intro");
const tag = document.getElementById("tag");
let current = 1, stopStars = null, scrambleTimer = 0;

/** Option 2's title: random glyphs that settle into the real letters. */
function scramble(el, text) {
  const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ#%&*+<>/";
  let frame = 0;
  const settle = text.split("").map(() => 14 + Math.floor(Math.random() * 26));
  const last = Math.max.apply(null, settle);
  clearInterval(scrambleTimer);
  scrambleTimer = setInterval(() => {
    el.textContent = text.split("").map((c, i) =>
      c === " " ? " " : frame > settle[i] ? c : chars[Math.floor(Math.random() * chars.length)]
    ).join("");
    if (++frame > last) clearInterval(scrambleTimer);
  }, 34);
}

/**
 * Option 5's starfield: three depth layers, redrawn only when the cursor
 * actually moves, so an idle screen costs nothing.
 */
function startStars(canvas) {
  const ctx = canvas.getContext("2d");
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  let w = 0, h = 0, pts = [], mx = 0, my = 0, queued = false;

  const size = () => {
    w = canvas.clientWidth; h = canvas.clientHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    pts = Array.from({ length: 170 }, () => ({
      x: Math.random() * w, y: Math.random() * h,
      z: Math.random() * 2 + 0.35, r: Math.random() * 1.5 + 0.35,
    }));
  };
  const draw = () => {
    queued = false;
    ctx.clearRect(0, 0, w, h);
    for (const p of pts) {
      ctx.beginPath();
      ctx.arc(p.x + mx * p.z * 26, p.y + my * p.z * 26, p.r, 0, 6.284);
      ctx.fillStyle = "rgba(190,225,240," + (0.10 + p.z * 0.16).toFixed(3) + ")";
      ctx.fill();
    }
  };
  const onMove = (e) => {
    mx = e.clientX / window.innerWidth - 0.5;
    my = e.clientY / window.innerHeight - 0.5;
    if (!queued) { queued = true; requestAnimationFrame(draw); }
  };
  const onResize = () => { size(); draw(); };

  size(); draw();
  window.addEventListener("pointermove", onMove, { passive: true });
  window.addEventListener("resize", onResize);
  return () => {
    window.removeEventListener("pointermove", onMove);
    window.removeEventListener("resize", onResize);
  };
}

function show(n) {
  current = n;
  if (stopStars) { stopStars(); stopStars = null; }
  bg.className = "b" + n;
  bg.innerHTML = BG[n]();
  tag.textContent = TAGS[n];
  for (const b of document.querySelectorAll("#bar button[data-n]")) {
    b.classList.toggle("on", b.dataset.n === String(n));
  }
  if (n === 5) stopStars = startStars(document.getElementById("stars"));
  play();
}

function play() {
  const n = current;
  intro.className = "in" + n;
  intro.innerHTML = INTRO[n]();
  if (n === 2) setTimeout(() => scramble(document.getElementById("scramble"), NAME), 1250);
  clearTimeout(play.hide);
  clearTimeout(play.strip);
  play.hide = setTimeout(() => {
    intro.classList.add("gone");
    play.strip = setTimeout(() => { intro.className = "off"; }, 750);
  }, 3400);
}

document.getElementById("bar").addEventListener("click", (e) => {
  const b = e.target.closest("button");
  if (!b) return;
  if (b.id === "replay") play(); else show(Number(b.dataset.n));
});
window.addEventListener("keydown", (e) => {
  if (e.key >= "1" && e.key <= "5") show(Number(e.key));
  if (e.key === " ") { e.preventDefault(); play(); }
});

show(1);
</script>
